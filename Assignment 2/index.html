
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Student Job Application Form">
    <meta name="author" content="Your Name">

    <title>Job Application Form</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="form-container">

        <h1>Job Application Form</h1>
        <p class="subtitle">
            Student Internship Application · * Required Fields
        </p>

        <form action="#" method="post">

            <!-- Personal Details -->
            <fieldset>
                <legend>Personal Details</legend>

                <label for="fullname">Full Name *</label>
                <input type="text" id="fullname" name="fullname"
                    placeholder="Enter your full name"
                    minlength="3" required>

                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email"
                    placeholder="example@gmail.com" required>

                <label for="password">Password *</label>
                <input type="password" id="password" name="password"
                    placeholder="Minimum 8 characters"
                    minlength="8" required>

                <label for="phone">Phone Number *</label>
                <input type="tel" id="phone" name="phone"
                    placeholder="Enter 10 digit mobile number"
                    pattern="[0-9]{10}" required>

                <label for="website">Portfolio URL</label>
                <input type="url" id="website" name="website"
                    placeholder="https://example.com">

                <label for="age">Age *</label>
                <input type="number" id="age" name="age"
                    min="17" max="35"
                    placeholder="Enter your age" required>

                <p class="choice-title">Gender</p>

                <div class="choices">
                    <input type="radio" id="male" name="gender" value="Male">
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="Female">
                    <label for="female">Female</label>

                    <input type="radio" id="other" name="gender" value="Other">
                    <label for="other">Other / Prefer not to say</label>
                </div>

            </fieldset>

            <!-- Education Details -->
            <fieldset>
                <legend>Education Details</legend>

                <label for="course">Select Your Course *</label>
                <select id="course" name="course" required>
                    <option value="">-- Select Course --</option>
                    <option value="BTech">BTech - Computer Science</option>
                    <option value="BCA">BCA</option>
                    <option value="MCA">MCA</option>
                    <option value="BBA">BBA</option>
                    <option value="Other">Other</option>
                </select>

                <label for="city">Preferred City</label>
                <input type="text" id="city" name="city"
                    list="cities" placeholder="Enter your preferred city">

                <datalist id="cities">
                    <option value="Delhi">
                    <option value="Meerut">
                    <option value="Noida">
                    <option value="Mumbai">
                    <option value="Bangalore">
                </datalist>

                <p class="choice-title">Your Skills</p>

                <div class="choices">
                    <input type="checkbox" id="html" name="skills" value="HTML">
                    <label for="html">HTML</label>

                    <input type="checkbox" id="css" name="skills" value="CSS">
                    <label for="css">CSS</label>

                    <input type="checkbox" id="js" name="skills" value="JavaScript">
                    <label for="js">JavaScript</label>

                    <input type="checkbox" id="python" name="skills" value="Python">
                    <label for="python">Python</label>
                </div>

            </fieldset>

            <!-- Other Details -->
            <fieldset>
                <legend>Availability & Other Details</legend>

                <label for="date">Available From *</label>
                <input type="date" id="date" name="date" required>

                <label for="time">Preferred Interview Time</label>
                <input type="time" id="time" name="time">

                <label for="resume">Upload Resume *</label>
                <input type="file" id="resume" name="resume"
                    accept=".pdf,.doc,.docx" required>

                <label for="stipend">Expected Monthly Stipend (₹)</label>
                <input type="range" id="stipend" name="stipend"
                    min="5000" max="25000" value="10000" step="1000">

                <label for="color">Favourite Colour</label>
                <input type="color" id="color" name="color" value="#16777b">

                <label for="message">Why would you like to join us?</label>
                <textarea id="message" name="message" rows="5"
                    placeholder="Write something about yourself..."></textarea>

            </fieldset>

            <!-- Form Buttons -->
            <div class="buttons">
                <button type="submit">Submit Application</button>
                <button type="reset" class="reset-btn">Reset Form</button>
            </div>

        </form>

    </main>

    <footer>
        <p>© 2026 Shalvi Vaish | Student Internship Application</p>
    </footer>

</body>
</html>
